    <header class="page-header">
        <div class="container">
            <h1>Nos Chambres</h1>
            <p>Choisissez votre hébergement idéal</p>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="filter-bar">
                <div class="filter-group">
                    <label>Type :</label>
                    <div class="filter-tabs">
                        <button class="filter-tab active" onclick="filterRooms('all')">Toutes</button>
                        <button class="filter-tab" onclick="filterRooms('ventilated')">Ventilées</button>
                        <button class="filter-tab" onclick="filterRooms('air_conditioned')">Climatisées</button>
                        <button class="filter-tab" onclick="filterRooms('apartment')">Appartements</button>
                    </div>
                </div>
                <div class="filter-group">
                    <label>Disponibilité :</label>
                    <div class="filter-tabs">
                        <button class="filter-tab active" onclick="filterStatus('all')">Toutes</button>
                        <button class="filter-tab" onclick="filterStatus('available')">Disponibles</button>
                    </div>
                </div>
            </div>
            <div class="rooms-grid" id="roomsGrid"></div>
        </div>
    </main>

    <!-- Modal de réservation -->
    <div class="modal-overlay" id="reservationModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Demande de Réservation</h3>
                <button class="cart-close" onclick="closeModal()">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <form id="reservationForm" onsubmit="submitReservation(event)">
                <div class="modal-body">
                    <div style="background: var(--bg-surface); border-radius: 8px; padding: 14px; margin-bottom: 18px;">
                        <p style="color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 4px;">Chambre
                            sélectionnée</p>
                        <p style="color: var(--brand-navy); font-size: 1rem; font-weight: 600; margin-bottom: 4px;">
                            <span id="modalRoomName"></span>
                        </p>
                        <p style="color: var(--brand-navy); font-weight: 600; margin-bottom: 0;"><span
                                id="modalRoomPrice"></span> / nuit</p>
                        <input type="hidden" id="selectedRoomId">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Nom complet *</label>
                        <input type="text" class="form-input" id="guestName" required placeholder="Votre nom">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Téléphone *</label>
                        <input type="tel" class="form-input" id="guestPhone" required placeholder="+225 00 00 00 00">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Arrivée *</label>
                            <input type="date" class="form-input" id="checkIn" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Départ *</label>
                            <input type="date" class="form-input" id="checkOut" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Nombre de personnes</label>
                        <select class="form-select" id="guestCount">
                            <option value="1">1 personne</option>
                            <option value="2" selected>2 personnes</option>
                            <option value="3">3 personnes</option>
                            <option value="4">4 personnes</option>
                        </select>
                    </div>
                    <div style="background: #dbeafe; border-radius: 8px; padding: 14px;">
                        <p style="color: #1e40af; margin-bottom: 4px; font-size: 0.85rem;">Total estimé</p>
                        <p style="font-size: 1.25rem; font-weight: 700; color: #1e40af; margin-bottom: 0;"><span
                                id="totalPrice">0 FCFA</span></p>
                        <p style="font-size: 0.8rem; color: #1e40af; margin-bottom: 0;">(<span id="nightCount">0</span>
                            nuit(s))</p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Annuler</button>
                    <button type="submit" class="btn btn-primary">Envoyer la demande</button>
                </div>
            </form>
        </div>
    </div>
